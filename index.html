<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Calcio Tattico — Versione 1.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#0b100d; --panel:#131b16; --panel2:#1a241e; --line:#26342b; --txt:#e9f0eb; --mut:#93a79a;
  --A:#2f6fed; --D:#e0453a; --GK:#f2b705; --E:#8a5cf6; --F:#d9822b; --ok:#35b26f; --bad:#e04848; --acc:#ffd166; --air:#8fd0ff;
}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(1200px 600px at 30% -10%,#17251c 0%,var(--bg) 60%);color:var(--txt);font:14px/1.45 Inter,system-ui,sans-serif;min-height:100%}
header{display:flex;align-items:center;gap:10px;padding:12px 20px;flex-wrap:wrap}
header h1{font:800 26px 'Barlow Condensed',sans-serif;letter-spacing:.6px;margin:0;text-transform:uppercase}
header h1 small{font-weight:600;color:var(--acc);font-size:16px;letter-spacing:1px;margin-left:6px}
header .sp{flex:1}
select,button,input,textarea{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 12px}
button{cursor:pointer;transition:background .15s,border-color .15s}
button:hover{border-color:#47604f;background:#22302a}
button.pri{background:linear-gradient(#2f6b47,#255639);border-color:#3e7d58}
button.pri:hover{background:linear-gradient(#367a51,#2a6141)}
button.ed{background:linear-gradient(#6a45d0,#5333b0);border-color:#8a6cf0}
button:disabled{opacity:.4;cursor:default}
textarea{width:100%;min-height:160px;font:12px/1.4 ui-monospace,Menlo,monospace;resize:vertical}
input[type=text],input[type=number]{width:100%}
main{display:flex;gap:18px;padding:0 20px 18px;align-items:flex-start;flex-wrap:wrap}
#stage{flex:1 1 680px;min-width:320px;max-width:980px}
#board{display:flex;align-items:stretch;background:#0d1410;border:1px solid var(--line);border-radius:12px 12px 0 0;overflow:hidden}
#board>div{padding:8px 14px;display:flex;align-items:center;gap:8px;border-right:1px solid var(--line)}
#board .clock{font:700 22px 'Barlow Condensed';letter-spacing:.5px}
#board .clock span+span{color:var(--acc);margin-left:8px}
#board .score{font:700 18px 'Barlow Condensed';letter-spacing:.5px}
#board button{margin:6px 6px;border-radius:8px}
#board .turnof{flex:1;justify-content:center;font:800 24px 'Barlow Condensed';letter-spacing:2px;text-transform:uppercase;transition:background .3s;color:#fff;white-space:nowrap}
#board .turnof small{font:600 14px Inter;letter-spacing:0;text-transform:none;opacity:.85;margin-left:8px}
#board .turnof.A{background:linear-gradient(90deg,#1d4fc4,#2f6fed,#1d4fc4)}
#board .turnof.D{background:linear-gradient(90deg,#a92a20,#e0453a,#a92a20)}
#board .turnof.P{background:linear-gradient(90deg,#2b4456,#3d6680,#2b4456)}
#board .turnof.E{background:linear-gradient(90deg,#4b2fa0,#8a5cf6,#4b2fa0)}
#board .turnof.F{background:linear-gradient(90deg,#8a4b12,#d9822b,#8a4b12)}
#board .turnof.O{background:#1a241e;color:var(--mut)}
#board .turnof .ar{font-size:18px;opacity:.85;margin:0 10px}
#endBtn.A,#wallBtn.A{background:var(--A);border-color:#7fa6ff;color:#fff;font-weight:700}
#endBtn.D,#wallBtn.D{background:var(--D);border-color:#ff9b92;color:#fff;font-weight:700}
#editbar{display:none;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px;background:#1a1430;border:1px solid #4b3a86;border-top:none}
#editbar.on{display:flex}
#editbar .t{font:700 13px 'Barlow Condensed';letter-spacing:1px;text-transform:uppercase;color:#c9b8ff;margin-right:4px}
#stage.tA #svgWrap{box-shadow:inset 0 0 0 3px rgba(47,111,237,.75)}
#stage.tD #svgWrap{box-shadow:inset 0 0 0 3px rgba(224,69,58,.75)}
#stage.tE #svgWrap{box-shadow:inset 0 0 0 3px rgba(138,92,246,.85)}
#stage.tF #svgWrap{box-shadow:inset 0 0 0 3px rgba(217,130,43,.85)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-weight:700;font-size:13px;color:#fff}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
#svgWrap{position:relative;background:#0d1410;border:1px solid var(--line);border-top:none;border-bottom:none}
#field{width:100%;display:block;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;cursor:default}
#hintbar{background:#0d1410;border:1px solid var(--line);border-top:none;border-radius:0 0 12px 12px;padding:8px 14px;color:var(--mut);font-size:13px;min-height:36px}
#hintbar b{color:var(--txt)}
#hintbar kbd{background:#24312a;border:1px solid #3a4c41;border-radius:4px;padding:0 5px;font:600 11px Inter;color:var(--txt)}
#ctx{position:absolute;z-index:5;width:262px;background:rgba(17,25,20,.97);border:1px solid #3b5244;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.55);overflow:hidden;animation:pop .14s ease}
#ctx.hidden,#tip.hidden{display:none}
#ctx .hd{padding:10px 12px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
#ctx .hd .num{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 15px 'Barlow Condensed';color:#fff;border:2px solid #fff;flex:none}
#ctx .hd .nm{font:700 17px 'Barlow Condensed';letter-spacing:.3px;line-height:1.1}
#ctx .hd .sub{font-size:11.5px;color:var(--mut)}
#ctx .it{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;border-radius:0;background:transparent;padding:8px 12px}
#ctx .it:hover{background:#22332a}
#ctx .it .ic{width:22px;text-align:center;font-size:15px;flex:none}
#ctx .it .lb{flex:1}
#ctx .it .h{font-size:11.5px;color:var(--mut)}
#ctx .it.warn .lb{color:#ffb86b}
#ctx .it.go .lb{color:#9be3b6;font-weight:600}
#ctx .it.now .lb{color:#9fd8ff}
#ctx .sep{height:1px;background:var(--line);margin:2px 0}
#tip{position:absolute;z-index:4;pointer-events:none;background:rgba(10,15,12,.92);border:1px solid #34483c;border-radius:8px;padding:6px 9px;font-size:12.5px;max-width:300px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
#tip b{color:var(--acc)}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:3;pointer-events:none}
#toast div{background:rgba(10,15,12,.9);border:1px solid #3b5244;border-radius:999px;padding:6px 16px;font:700 16px 'Barlow Condensed';letter-spacing:.6px;text-transform:uppercase;animation:toast 1.8s ease forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translateY(-6px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#result{position:absolute;left:0;right:0;bottom:54px;display:flex;justify-content:center;pointer-events:none;z-index:6;padding:0 10px}
#result .box{pointer-events:auto;background:rgba(10,15,12,.94);border:1px solid var(--acc);border-radius:12px;padding:10px 18px;text-align:center;max-width:min(560px,100%);font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:pop .2s ease}
#result .box h2{font:800 26px 'Barlow Condensed';margin:0 0 2px;color:var(--acc);letter-spacing:1px;text-transform:uppercase}
#result .box .btns{margin-top:8px!important}
#result .box .btns button{padding:6px 12px;font-size:13px}
@media (max-width:640px){#result{bottom:46px;padding:0 6px}#result .box{width:100%;padding:8px 12px;font-size:13px}#result .box h2{font-size:20px}}
aside{flex:0 1 340px;min-width:290px;display:flex;flex-direction:column;gap:12px}
aside section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
aside h3{font:700 13px 'Barlow Condensed';letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
#setup label{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px;margin:5px 0;font-size:13px;color:var(--mut)}
#setup select{padding:5px 8px}
.hint{color:var(--mut);font-size:13px;margin:3px 0}
.big{font:700 21px 'Barlow Condensed';letter-spacing:.3px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:1fr auto 64px;gap:3px 8px;font-size:12.5px;align-items:center;margin-top:8px}
.stats.edit{grid-template-columns:1fr auto auto auto}
.stats .grp{grid-column:1/-1;font:700 11px 'Barlow Condensed';letter-spacing:1px;text-transform:uppercase;color:#6f8578;margin-top:4px}
.stats button{padding:0 8px;border-radius:6px;line-height:20px}
.bar{height:6px;background:#26332b;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#c9a640,var(--acc))}
#dice{display:flex;flex-direction:column;gap:6px;max-height:250px;overflow:auto}
.dg{background:var(--panel2);border-radius:9px;padding:7px 9px;animation:pop .25s ease}
.dg .lb{font-size:12px;color:var(--mut);display:flex;justify-content:space-between;gap:8px}
.dg .ds{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.die{width:25px;height:25px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;background:#3d4a43;color:#e9f0eb;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);animation:spin .35s ease}
.die.s{background:var(--ok)}.die.o{background:var(--bad)}.die.n{background:#56688a}
.res-ok{color:#7fe0a8;font-weight:700}.res-ko{color:#ff8a8a;font-weight:700}
@keyframes spin{from{transform:rotate(-140deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translateY(-4px) scale(.98);opacity:0}to{transform:none;opacity:1}}
#log{max-height:240px;overflow:auto;font-size:13px;display:flex;flex-direction:column;gap:3px}
#log .t{color:var(--acc);font-weight:600;margin-top:5px}
#log .g{color:var(--acc);font-weight:700}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:30}
#modal.hidden{display:none}
.mbox{background:var(--panel);border:1px solid #4b6656;border-radius:16px;padding:18px 20px;max-width:480px;width:92%;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .16s ease;max-height:92vh;overflow:auto}
.mbox h2{font:700 24px 'Barlow Condensed';margin:0 0 6px;letter-spacing:.3px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mbox .btns{flex-direction:column}
.mbox .btns.inl{flex-direction:row;justify-content:flex-end}
.mbox .btns button{text-align:left;padding:9px 12px}
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;padding:8px;border:3px solid #ddd;border-bottom:none;border-radius:4px 4px 0 0;background:repeating-linear-gradient(45deg,#1b2620 0 6px,#18221c 6px 12px)}
.zones button{padding:12px 6px;text-align:center}
.hot{color:#ff9b6b;font-weight:700}.cold{color:#8fd0ff;font-weight:700}
#coach{background:linear-gradient(180deg,#2a2410,#1d1a0e);border:1px solid #6b5a1f;border-radius:12px;padding:10px 14px;margin-bottom:10px;animation:pop .2s ease}
#coach.hidden{display:none}
#coach.inv{background:#16201a;border-color:#3e5547;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#coach .ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:700 18px 'Barlow Condensed';letter-spacing:.4px}
#coach .tag{background:var(--acc);color:#2a2100;border-radius:999px;padding:1px 9px;font:700 12px Inter;letter-spacing:.3px}
#coach .dots{display:flex;gap:4px;margin-left:auto}#coach .dots i{width:9px;height:9px;border-radius:50%;background:#4a4228;display:block}
#coach .dots i.d{background:var(--ok)}#coach .dots i.c{background:var(--acc)}
#coach .ct{margin:6px 0;font-size:14px;line-height:1.5}#coach.inv .ct{flex:1;margin:0}
#coach .cb{display:flex;gap:6px;flex-wrap:wrap}#coach .cb button{padding:5px 10px;font-size:13px}
button.tut{background:linear-gradient(#b8921f,#94740f);border-color:#e0b93a;color:#1d1600;font-weight:700}
.pulse{animation:pl 1s infinite alternate}@keyframes pl{from{opacity:.35}to{opacity:1}}
details#help{margin:0 20px 26px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px}
details#help summary{cursor:pointer;font:700 16px 'Barlow Condensed';letter-spacing:.5px}
details#help li{margin:4px 0}

html{touch-action:manipulation}
#subs{position:absolute;left:50%;bottom:50px;transform:translateX(-50%);z-index:4;max-width:min(92%,640px);background:rgba(8,12,10,.86);border:1px solid #3b5244;border-radius:10px;padding:6px 14px;font-size:14.5px;line-height:1.35;text-align:center;opacity:0;transition:opacity .35s;pointer-events:none;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4)}
#subs.on{opacity:1;pointer-events:auto}
#subs .dot{margin-right:7px;vertical-align:middle}
#camCtl{position:absolute;left:8px;bottom:8px;z-index:4;display:flex;gap:4px}
#camCtl button{padding:3px 9px;font-size:15px;line-height:20px;background:rgba(13,20,16,.85)}
#camCtl button.on{border-color:var(--acc);color:var(--acc)}
#mini{position:absolute;right:8px;bottom:8px;z-index:4;width:84px;border:1px solid #3e5547;border-radius:6px;background:rgba(10,20,14,.85);cursor:pointer}
#mini.hidden{display:none}
#fullOpts.hidden,#lbA.hidden,#lbD.hidden,.hidden{display:none!important}
#board .score .sc{font:800 22px 'Barlow Condensed';letter-spacing:1px}
#langSel{padding:5px 8px}
@media (max-width:760px){
  header{padding:8px 10px;gap:6px}header h1{font-size:20px}header h1 small{display:none}
  header select{order:5;flex-basis:100%;min-width:0}
  main{padding:0 6px 12px;gap:10px}
  #stage{min-width:0;flex-basis:100%}
  aside{min-width:0;flex-basis:100%}
  #board{flex-wrap:wrap}
  #board>div{padding:6px 8px}
  #board .turnof{order:-1;flex-basis:100%;border-right:none;padding:8px;font-size:18px;letter-spacing:1px}
  #board .clock{font-size:17px;flex:1}
  #board .score{display:none}
  #board button{margin:4px;padding:6px 8px}
  #ctx{background:#111914;position:fixed;left:8px!important;right:8px;bottom:8px;top:auto!important;width:auto;max-height:62vh;overflow:auto;z-index:15}
  #ctx .it{padding:11px 14px}
  details#help{margin:0 6px 16px}
}

.sumtxt{font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;background:#0c120e;border:1px solid #2c3d33;border-radius:8px;padding:10px;white-space:pre;overflow:auto;max-height:50vh;text-align:left}

.pbar{height:9px;border-radius:5px;background:#3a2626;position:relative;overflow:hidden;margin:5px 0 3px}
.pfill{position:absolute;left:0;top:0;bottom:0;background:#2f9a5a}
.pmark{position:absolute;top:-2px;bottom:-2px;width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 3px #000}
.ptxt{font-size:11.5px;opacity:.75}

/* ===== v1.2: campo largo, in alto le cose principali, in basso le secondarie ===== */
main{flex-direction:column;align-items:stretch;gap:12px}
#stage{flex:none;width:100%;max-width:none;min-width:0}
#setup{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px}
#setup h3{display:none}
#setup label{display:flex;align-items:center;gap:6px;margin:0;font-size:13px}
#setup label select{max-width:220px}
#setup #fullOpts{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px}
#setup #fullOpts.hidden{display:none}
#setup #fullOpts .btns{margin:0}
#setup .hint{flex-basis:100%;margin:0;font-size:12px}
aside{flex:none;width:100%;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;align-items:start}
aside #log{max-height:260px}
#mini.rot{width:132px}

#undoBtn{background:#3a3f4a;border-color:#6b7385;color:#fff}
#undoBtn:disabled{opacity:.4}

</style>
</head>
<body>
<header>
  <h1><span data-i18n="ui.title"></span> <small>v1.3.2</small></h1>
  <div class="sp"></div>
  <select id="langSel" class="hidden" aria-label="Lingua"></select>
  <select id="scn" aria-label="Scenario"></select>
  <button class="tut" id="tutBtn" data-i18n="ui.tutorial"></button>
  <button class="ed" id="editBtn" data-i18n="ui.editor"></button>
  <button class="ed" id="sumBtn" data-i18n="ui.summary"></button>
  <button class="pri" id="newBtn" data-i18n="ui.new"></button>
</header>
<main>
  <section id="setup"><h3 data-i18n="setup.title"></h3>
      <label><span data-i18n="setup.type"></span><select id="gtype"><option value="azione" data-i18n="setup.type.azione"></option><option value="partita" data-i18n="setup.type.partita"></option></select></label>
      <label><span data-i18n="setup.mode"></span><select id="mode"><option value="vsD" data-i18n="setup.mode.vsD" selected></option><option value="2g" data-i18n="setup.mode.2g"></option><option value="vsA" data-i18n="setup.mode.vsA"></option></select></label>
      <label id="lbA"><span data-i18n="setup.aiA"></span><select id="stA"></select></label>
      <label id="lbD"><span data-i18n="setup.aiD"></span><select id="stD"></select></label>
      <div id="fullOpts" class="hidden">
        <label><span data-i18n="setup.formA"></span><select id="fmA"></select></label>
        <label><span data-i18n="setup.formD"></span><select id="fmD"></select></label>
        <label><span data-i18n="setup.len"></span><select id="mlen"><option value="20" data-i18n="setup.len.20"></option><option value="40" data-i18n="setup.len.40" selected></option><option value="80" data-i18n="setup.len.80"></option></select></label>
        <label><span data-i18n="setup.maxAct"></span><select id="maxAct"><option value="3">3</option><option value="4" selected>4</option><option value="6">6</option><option value="11" data-i18n="setup.maxAct.all"></option></select></label>
        <div class="btns"><button id="startMatch" class="pri" style="flex:1" data-i18n="setup.start"></button></div>
      </div>
      <div class="hint" id="setupHint"></div>
    </section>
  <div id="stage">
    <div id="coach" class="hidden"></div>
    <div id="board">
      <div class="clock"><span id="bTurn"></span><span id="bTime"></span></div>
      <div class="turnof" id="bTeam"></div>
      <div class="score" id="bScore"></div>
      <button id="wallBtn" style="display:none" data-i18n="ui.wall"></button>
      <button id="undoBtn" data-i18n="ui.undo"></button>
      <button id="endBtn" data-i18n="ui.endTurn"></button>
    </div>
    <div id="editbar">
      <span class="t" data-i18n="ui.editor"></span>
      <button class="pri" id="edPlay" data-i18n="ed.play"></button>
      <button id="edSave" data-i18n="ed.save"></button>
      <button id="edExport" data-i18n="ed.export"></button>
      <button id="edImport" data-i18n="ed.import"></button>
      <button id="edClear" data-i18n="ed.clear"></button>
      <button id="edExit" data-i18n="ed.exit"></button>
    </div>
    <div id="svgWrap">
      <svg id="field" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="camCtl"><button id="camOut" title="−">−</button><button id="camIn" title="+">+</button><button id="camFit">⤢</button><button id="camFollow">◎</button></div>
      <svg id="mini" class="hidden" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="ctx" class="hidden"></div>
      <div id="tip" class="hidden"></div>
      <div id="toast"></div>
      <div id="subs"></div>
      <div id="result"></div>
    </div>
    <div id="hintbar"></div>
  </div>
  <aside>
    <section id="status"></section>
    <section id="card"></section>
    <section><h3 data-i18n="ui.diceTitle"></h3><div id="dice"></div></section>
    <section><h3 data-i18n="ui.logTitle"></h3><div id="log"></div></section>
  </aside>
</main>
<details id="help">
  <summary data-i18n="help.title"></summary>
  <ul id="helpList"></ul>
</details>
<div id="modal" class="hidden"><div class="mbox"><h2 id="mTitle"></h2><div id="mBody"></div><div class="btns" id="mBtns"></div></div></div>
<script>
// ===================== Testi (dizionario per la traduzione) =====================
// Per aggiungere una lingua: copiare il blocco "it", tradurre i valori e lasciare invariate le chiavi
// e i segnaposto tra graffe ({p}, {m}, ...). Il selettore della lingua compare da solo.
const LANGK='calcioTattico.lingua';
const DICT={it:{
 'lang.label':"🇮🇹 IT",
 // Interfaccia
 'ui.title':"Calcio Tattico",
 'ui.tutorial':"Tutorial",
 'ui.editor':"Editor",
 'ui.new':"Nuova azione",
 'ui.summary':"Riepilogo",
 'ui.newMatch':"Nuova partita",
 'ui.wall':"Barriera",
 'ui.undo':"↶ Annulla",
 'ui.endTurn':"Fine turno",

 // Tutorial: lezioni
 'tut.1.t':"Il campo e i turni",
 'tut.1.1':"Ogni <b>esagono</b> vale 2 metri e ogni <b>turno</b> 2 secondi di gioco. Le squadre attivano un calciatore alla volta, alternandosi: la <b>fascia colorata in alto</b> dice chi gioca. In questa lezione il rosso resta fermo.",
 'tut.1.2':"Apri il menu del <b>numero 8</b>: <b>clicca</b> sulla pedina (su telefono o tablet: toccala).",
 'tut.1.3':"Scegli <b>Conduci palla</b> e clicca l'<b>esagono segnato</b>. Gli esagoni chiari sono quelli raggiungibili: con la palla si va più piano.",
 'tut.1.4':"Ora premi <b>Fine turno blu</b> nel tabellone. Quando entrambe le squadre hanno finito si gioca la <b>fase palla</b> e comincia un nuovo turno.",
 'tut.1.end':"Questo è il ciclo base: attivazioni alternate, fase palla, nuovo turno.",
 'tut.2.t':"Velocità e orientamento",
 'tut.2.1':"Ogni calciatore ha <b>Scatto</b> (quando parte da fermo) e <b>Corsa</b> (quando era già lanciato), con valori diversi con e senza palla. Li trovi nella <b>carta giocatore</b> passando sopra la pedina. Il <b>cono chiaro</b> indica dove guarda.",
 'tut.2.2':"Conduci l'<b>Ala (7)</b> in avanti di almeno 6 metri (3 esagoni): finirà <b>in corsa</b>, con l'anello giallo tratteggiato. Poi chiudi il turno con <b>Fine turno blu</b>.",
 'tut.2.3':"Nel turno nuovo l'Ala parte già lanciata: può coprire molta più strada, ma solo andando <b>dritta</b>. Se sterza rallenta, e all'indietro in corsa non può andare. Conducila per almeno 12 metri.",
 'tut.2.4':"A fine movimento il calciatore guarda dove stava correndo. Se gli restano punti, dal menu puoi girarlo con <b>Ruota a sinistra</b> o <b>a destra</b> (1 punto ogni 60°, e in corsa perde la corsa); prima di muoverlo, invece, la prima rotazione è gratis. Prova a ruotare un calciatore.",
 'tut.2.end':"Ricorda: chi è già lanciato va più lontano, ma cambiare direzione lo frena.",
 'tut.3.t':"Passaggi",
 'tut.3.1':"Ci sono due passaggi. <b>Diretto</b>: parte subito, anche in corsa, verso un compagno o uno spazio; la portata dipende dalla tecnica e la precisione cala con la distanza. <b>Preciso</b>: solo da fermo, la palla parte a fine turno, così il compagno ha tempo di arrivarci, ed è più preciso. Quando scegli il bersaglio gli esagoni sono colorati: verde sicuro, rosso rischioso.",
 'tut.3.2':"Come prima azione, apri il menu dell'8 e gioca un <b>Passaggio diretto</b> al <b>10</b>. Passando sopra il compagno vedi la probabilità di riuscita.",
 'tut.3.3':"Chi riceve ha solo <b>mezzo movimento</b> per il resto del turno, perché il passaggio ha preso tempo. Chiudi il turno con <b>Fine turno blu</b>.",
 'tut.3.4':"Ora un <b>Passaggio preciso</b> dal 10 verso l'<b>esagono segnato</b>, poi muovi la <b>9</b> verso quel punto e chiudi il turno: la palla parte quando la 9 è già arrivata.",
 'tut.3.5':"Attenzione ai corpi: se un avversario è <b>sulla linea</b>, la palla lo colpisce (respinta) o viene intercettata. Chi è <b>accanto</b> alla linea può allungarsi. Prima di cliccare guarda sempre la percentuale nel suggerimento.",
 'tut.3.end':"Diretto per giocare veloce, preciso per mandare il compagno nello spazio.",
 'tut.4.t':"Fuorigioco",
 'tut.4.1':"La <b>linea gialla tratteggiata</b> è il fuorigioco: la più avanzata tra il penultimo difensore e la palla. Una <b>bandierina</b> compare sugli attaccanti oltre la linea. Se uno di loro riceve, è punizione per la difesa.",
 'tut.4.2':"Gioca un <b>Passaggio preciso</b> verso l'<b>esagono segnato</b>, oltre la linea, e <b>solo dopo</b> muovi la <b>9</b> verso il pallone. Il fuorigioco si valuta quando dichiari il passaggio, non quando la palla arriva.",
 'tut.4.end':"Se la 9 fosse partita prima del passaggio sarebbe stata in fuorigioco: è il tempo giusto dell'attacco alla profondità.",
 'tut.5.t':"Difendere",
 'tut.5.1':"Ora giochi il <b>rosso</b> e il computer attacca. Si contrasta solo un avversario <b>davanti a te</b> (nel tuo cono) e adiacente. Puoi scegliere l'intensità: la finestra mostra per ognuna la probabilità di vincere, di pareggiare, di essere saltato e di fare fallo. Da dietro si fa fallo più facilmente.",
 'tut.5.2':"<b>Recupera il pallone</b>: chiudi le linee di passaggio, avvicinati al portatore tenendolo davanti e usa <b>Contrasto</b> dal menu. Attenzione ai falli in area: sono rigore.",
 'tut.5.end':"In difesa conta la posizione prima del contrasto: chi arriva frontale vince più duelli e fa meno falli.",
 'tut.6.t':"Tirare",
 'tut.6.1':"Il tiro va verso una delle <b>6 zone</b> della porta. I tiri <b>bassi</b> possono essere chiusi da chi è sulla linea o accanto, e i corpi coprono la visuale al portiere. Quelli <b>alti</b> passano sopra, ma sono meno precisi. Da vicino la parata è più difficile, e se il portiere è fuori posizione o già superato la porta è vuota.",
 'tut.6.2':"Tira! Scegli il <b>Tiro diretto</b> (immediato, più debole) oppure <b>Carica tiro</b> (più potente, ma lo vedono tutti e parte a fine turno). Nella scelta della zona trovi le probabilità.",
 'tut.6.end':"Più corpi ci sono davanti, più conviene alzare la mira o spostarsi per trovare la linea libera.",
 'tut.7.t':"Carica e finta",
 'tut.7.1':"Tiri potenti e lanci vanno <b>caricati</b>: si dichiarano come prima azione del turno e tutti li vedono. Nella fase palla puoi eseguirli oppure <b>fintare</b>.",
 'tut.7.2':"Come <b>prima azione</b> apri il menu del 10 e scegli <b>Carica tiro</b>.",
 'tut.7.3':"Il difensore vede la carica e ti esce addosso (bordo arancione: è <b>impegnato</b>). Chiudi il turno con <b>Fine turno blu</b>: nella fase palla scegli <b>Finta</b>. Se la tua Finta batte la sua Lettura resta sbilanciato. Poi gioca il tiro diretto o un passaggio.",
 'tut.7.end':"La finta funziona solo contro chi si è impegnato: un difensore che aspetta non abbocca.",
 'tut.8.t':"Palla ferma",
 'tut.8.1':"Fallo al limite dell'area: <b>punizione</b>. Scegli <b>Piazzamento</b>: tu e il computer spostate un calciatore a testa, a turno (i rossi a 9 m dalla palla, cerchio arancione). Quando hai finito premi <b>Pronto blu</b>: da lì la tua disposizione è fissata e il computer completa la sua.",
 'tut.8.2':"Fischio! Nella finestra della <b>battuta</b> scegli: tiro potente, tiro a giro sopra la barriera, cross in area o passaggio. Tutto parte subito: a palla ferma nessuno si muove prima del calcio. Il fuorigioco qui vale (non vale solo su angolo, rimessa laterale e rimessa dal fondo).",
 'tut.8.end':"A palla ferma il tempo non conta: vince chi si posiziona meglio.",
 'tut.9.t':"Partita di allenamento",
 'tut.9.1':"Ora tutto insieme: 5 attaccanti contro un <b>blocco basso</b> di 5 più il portiere, guidato dal computer. Fai girare la palla, cerca il varco, evita il fuorigioco. <b>Obiettivo: segnare.</b>",
 'tut.9.end':"Complimenti, conosci tutte le regole! Puoi allenarti contro il computer, sfidare un amico o provare la <b>Partita 11 contro 11</b> dal pannello <b>Partita</b>.",
 // Regole (sezione in fondo alla pagina)
 'help.title':"Regole del prototipo (1 esagono = 2 m · 1 turno = 2 s)",
 'help.1':"<b>Comandi</b>: <b>clic</b> (o tocco) su un tuo calciatore non grigio apre il menu; lo stesso clic sceglie destinazioni e bersagli, <b>Esc</b> annulla. <b>Fine turno</b>: la tua squadra smette di muovere, l'altra può continuare. Rotellina o pizzico per lo zoom, trascina per spostare la vista.",
 'help.2':"<b>Velocità e orientamento</b>: Scatto da fermo, Corsa se nel turno prima hai percorso almeno 6 m (o tutto lo scatto). In corsa: dritto a piena velocità, una sterzata di 60° toglie un quarto della velocità, una di 120° ti riporta allo scatto e ti fa perdere la corsa, indietro non si può (al massimo resti fermo e freni). Da fermo puoi andare in ogni direzione e arretrare fino a 4 m. A fine movimento il calciatore guarda dove stava correndo; se gli restano punti puoi girarlo (1 punto ogni 60°, e in corsa perde la corsa). Prima di muoverlo la prima rotazione è gratis.",
 'help.3':"<b>Passaggio diretto</b>: parte subito, anche dopo aver condotto, verso un compagno o uno spazio. La portata va da 20 a 40 m secondo la tecnica; la difficoltà sale ogni 12 m. Chi riceve ha mezzo movimento. <b>Passaggio preciso</b>: solo se il giocatore non si è mosso; fino a 40 m, parte nella fase palla ed è più preciso. Gli esagoni colorati mostrano la probabilità di riuscita.",
 'help.4':"<b>Intercetti</b>: chi è a 2 m dalla traiettoria e la vede davanti la tocca nel 42% dei casi (58% se è bravo nell'intercetto); di lato 28% (42%); se è girato non può. Se la palla gli passa a ridosso di chi calcia, meno. Chi è sulla traiettoria la tocca nel 72% (83%), altrimenti è tunnel. Se la tocca la controlla (secondo lo Stop) o la devia. Gli esagoni colorati tengono già conto di questo rischio.",
 'help.5':"<b>Respinte</b>: direzione casuale; distanza d3 esagoni per il passaggio corto, d6 per passaggio lungo, tiro diretto e lancio, d6 + successi di potenza per il tiro. Se la palla esce dopo un tocco della difesa è angolo o rimessa per l'attacco.",
 'help.6':"<b>Carica</b> lancio o tiro: prima attivazione del turno, visibile a tutti; nella fase palla si esegue o si finta.",
 'help.7':"<b>Tiro</b>: la linea va verso la zona scelta. Tiri bassi: chiude anche chi è adiacente; ogni corpo sulla linea copre la visuale al portiere. Tiri alti: chiude solo chi è entro 4 m dal tiratore, +1 alla difficoltà, rischio di tirare sopra la traversa. Portiere lontano dalla linea o già superato = porta vuota; da vicino la parata è più difficile (+3 entro 6 m, +2 entro 10 m, +1 entro 12 m).",
 'help.8':"<b>Palla ferma</b> (punizione, rigore, angolo, rimesse, calcio d'inizio): chi batte sceglie battuta rapida o piazzamento libero a turni alternati, con le distanze rispettate e la barriera automatica. Niente fuorigioco su angolo, rimessa laterale e rimessa dal fondo.",
 'help.9':"<b>Rigore</b>: il portiere sceglie in segreto il lato. Se indovina para molto più spesso, altrimenti quasi mai. <b>Cartellini</b>: due gialli o un rosso = espulsione.",
 'help.10':"<b>Partita 11 contro 11</b>: campo intero, due tempi, risultato. Ogni turno puoi attivare un numero limitato di calciatori; gli altri si muovono da soli seguendo il modulo e la tattica (in fase palla). I blu attaccano verso l'alto, i rossi verso il basso, per tutta la partita.",
 'help.12':"<b>Dribbling</b>: conducendo palla puoi scegliere un esagono oltre un avversario che sta sulla tua linea di corsa (esagoni arancioni, 1 punto in più). Passando sopra vedi quante volte lo salti contro un contrasto leggero, medio o forte; se arrivi in corsa hai lo slancio. Se lo salti continui fino alla destinazione e lui resta fermo per il resto del turno e con metà movimento al turno dopo. Se ti ruba palla ti fermi davanti a lui e lui la gioca con metà movimento; se pareggiate la palla schizza vicino a lui; può anche fare fallo. Se è girato di spalle o sbilanciato passi senza duello. Un solo dribbling per corsa.",
 'help.13':"<b>Contrasto</b>: se sei adiacente al portatore e lo hai davanti, scegli Contrasto (anche subito dopo esserti mosso). La finestra mostra per ogni intensità quante volte vinci, pareggi (palla contesa), vieni saltato o fai fallo. Alle spalle del portatore vinci molto meno e rischi di più il fallo; in corsa vinci meno e, di lato o da dietro, rischi ancora di più. Se perdi resti sbilanciato.",
 'help.14':"<b>Tiro a giro</b>: da fuori area, tra 16 e 36 m, carica il tiro e scegli Tiro a giro. Mira solo agli angoli e scavalca i corpi sulla linea, tranne la barriera vicina (che salta). È meno potente: il portiere ben piazzato para più spesso e, se la precisione manca di poco, il pallone non rientra e va fuori.",
 'help.15':"<b>Ordini (11 contro 11)</b>: un giocatore che sposti a mano tiene la posizione che gli hai dato e scorre con la squadra seguendo la palla, finché la tua squadra ha il possesso. Quando l'avversario conquista palla l'ordine si cancella e il giocatore rientra nel suo ruolo, con i tempi della sua corsa (girarsi costa).",
 'help.11':"<b>Modalità</b>: il gioco è pensato per <b>due persone</b> sullo stesso schermo. L'<b>allenamento</b> mette il computer dall'altra parte per imparare e provare situazioni. Il <b>Tutorial</b> spiega le regole in nove lezioni."

const axToOff=(q,r)=>({c:q,r:r+((q-(q&1))>>1)});

const hd=(a,b)=>{const dq=a.q-b.q,dr=a.r-b.r;return (Math.abs(dq)+Math.abs(dr)+Math.abs(dq+dr))/2};
const add=(h,d,n=1)=>({q:h.q+DIRS[d][0]*n,r:h.r+DIRS[d][1]*n});
const same=(a,b)=>a.q===b.q&&a.r===b.r;
const angTo=(a,b)=>{const p=px(a),q=px(b);return Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI};
const dirAng=i=>-90+60*i;

function cubeRound(fq,fr){const fs=-fq-fr;let q=Math.round(fq),r=Math.round(fr),s=Math.round(fs);
  const dq=Math.abs(q-fq),dr=Math.abs(r-fr),ds=Math.abs(s-fs);
  if(dq>dr&&dq>ds)q=-r-s;else if(dr>ds)r=-q-s;return{q:q+0,r:r+0}}
function line(a,b){const n=hd(a,b),out=[];for(let i=0;i<=n;i++){const t=n?i/n:0;
  out.push(cubeRound(a.q+1e-6+(b.q-a.q)*t,a.r+2e-6+(b.r-a.r)*t))}return out}
function hexRing(c,r){const res=[];let h=add(c,4,r);for(let i=0;i<6;i++)for(let j=0;j<r;j++){res.push(h);h=add(h,i)}return res}
function pixToHex(x,y){x-=MX;y-=MY;return cubeRound((2/3*x)/S,(-1/3*x+SQ3/3*y)/S)}

const FASTM=()=>G&&G.fast;
function d6(){const a=new Uint8Array(1);do{crypto.getRandomValues(a)}while(a[0]>=252);return a[0]%6+1}
// ===================== Motore a probabilità (v1) =====================
// Le probabilità sono quelle dei vecchi dadi (d6, successo con 4+), rese continue:
// riserva e difficoltà possono essere numeri non interi e si interpola tra i valori interi vicini.
// Ogni controllo si risolve con UN solo tiro d100 (1-100): riesce se esce un numero basso (≤ soglia).
function d100(){const a=new Uint16Array(1);do{crypto.getRandomValues(a)}while(a[0]>=65500);return a[0]%100+1}
// probabilità di ottenere almeno k successi con n "dadi" (n e k anche non interi)
function pGE(n,k){n=Math.max(1,n);const n0=Math.floor(n),wn=n-n0,k0=Math.floor(k),wk=k-k0;
  const P=(nn,kk)=>pAtLeastI(nn,kk);
  const a=(1-wk)*P(n0,k0)+wk*P(n0,k0+1);if(!wn)return a;const b=(1-wk)*P(n0+1,k0)+wk*P(n0+1,k0+1);return (1-wn)*a+wn*b}
// Controllo con soglia: restituisce il margine m (successi in più o in meno rispetto alla difficoltà).
// Senza soglia (diff null): restituisce il numero di successi.
function roll(n,label,diff){n=Math.max(1,n);const u=d100(),x=(u-0.5)/100;
  if(diff==null){let k=0;for(let j=Math.ceil(n);j>=1;j--){if(x<pGE(n,j)){k=j;break}}
    if(!FASTM())showRoll(label,u,null,k);return{succ:k,u}}
  let m=-Math.ceil(diff)-1;for(let j=Math.ceil(n)+1;j>=-Math.ceil(diff)-1;j--){if(x<pGE(n,diff+j)){m=j;break}}
  const p=pGE(n,diff);if(!FASTM())showRoll(label,u,p,null,m);return{succ:diff+m,m,u,p}}
// Evento semplice con probabilità p (riesce se esce ≤ p)
function chance(p,label){const u=d100(),ok=u<=Math.round(p*100);if(!FASTM()&&label)showRoll(label,u,p,null,ok?0:-1);return ok}
function rollD6(label){const v=d6();if(!FASTM())showDice(label,[v],null,null,true);return v}
function binom(n,k){let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return r}
function pAtLeastI(n,k){n=Math.max(1,n);if(k<=0)return 1;if(k>n)return 0;let s=0;for(let i=k;i<=n;i++)s+=binom(n,i);return s/Math.pow(2,n)}
function pAtLeast(n,k){return pGE(n,k)}
function pExactI(n,k){n=Math.max(1,n);if(k<0||k>n)return 0;return binom(n,k)/Math.pow(2,n)}
function pExact(n,k){n=Math.max(1,n);const n0=Math.floor(n),w=n-n0;return w?(1-w)*pExactI(n0,k)+w*pExactI(n0+1,k):pExactI(n0,k)}
function pWinDuel(a,d){a=Math.max(1,a);d=Math.max(1,d);let s=0;for(let i=0;i<=Math.ceil(a);i++){let below=0;for(let j=0;j<i&&j<=Math.ceil(d);j++)below+=pExact(d,j);s+=pExact(a,i)*below}return s}
function pTieDuel(a,d){let s=0;for(let i=0;i<=Math.ceil(Math.max(a,d));i++)s+=pExact(a,i)*pExact(d,i);return s}

// ===================== Attivazioni =====================
function ptsFor(a){const p=a.p,hb=isHolder(p);
  let base=p.state==='corsa'?(hb?p.st.corsaP:p.st.corsa):(hb?p.st.scattoP:p.st.scatto),sc0=hb?p.st.scattoP:p.st.scatto;
  if(p.halfMove||p.slowTurn===G.turn){base=Math.floor(base/2);sc0=Math.floor(sc0/2)}
  const run=Math.max(0,base-a.spent),sc=Math.max(0,sc0-a.spent);return{run,sc,max:Math.max(run,sc)}}
// Conduzione attraverso un avversario sulla linea di corsa (solo per chi muove a mano il portatore):
// un solo avversario, l'esagono dopo di lui libero; se ti vede arrivare c'è il duello (+1 punto), se è girato o sbilanciato passi.
function throughInfo(a,h){const p=a.p;if(!isHolder(p)||a.moved||restrictedKick(a)||isAI(p.team)||G.quiet)return null;
  const L=line(p,h);let o=null,i0=-1;for(let i=1;i<L.length-1;i++){const q=playerAt(L[i]);if(q&&q.team!==p.team){if(o)return null;o=q;i0=i}}
  if(!o||o.gk)return null;const next=L[i0+1];if(!next||(playerAt(next)&&!same(next,h)))return null;
  const before=L[i0-1];const duel=!isSb(o)&&inFront(o,before);return{id:o.id,duel,before:{q:before.q,r:before.r}}}
function moveOptions(a){const p=a.p,pts=ptsFor(a);a.pts=pts;const res=new Map();
  for(const h of FIELD){const d=hd(p,h);if(d===0||d>pts.max||playerAt(h))continue;const th=blockedPath(p,h)?throughInfo(a,h):null,extra=th&&th.duel?1:0;
    const md=dirTo(p,h),sd=stepDiff(p.f,md);let cost,nf=md,back=false,lim=pts.run,brake=false;
    if(p.state==='corsa'){
      // in corsa: dritto a piena velocità, sterzare costa velocità, indietro è impossibile (al massimo si frena restando fermi)
      const ang=angDiff(angTo(p,h),dirAng(p.f));
      if(ang<=30)cost=d;
      else if(ang<=90){cost=d;lim=Math.max(pts.sc,Math.floor(pts.run*3/4))}
      else if(ang<=150){cost=d+1;lim=pts.sc;brake=true}
      else continue;
      cost+=extra;if(cost>lim||(blockedPath(p,h)&&!th))continue;
      res.set(K(h),{h,cost,nf,back,d,lim,brake,thru:th});continue}
    if(sd<=1)cost=d;
    else if(sd===2){cost=d+1;lim=pts.sc}
    else if(d<=2){cost=d;nf=p.f;back=true;lim=Math.min(pts.sc,2)}
    else{cost=d+2;lim=pts.sc}
    if(th&&back)continue;cost+=extra;if(cost>lim||(blockedPath(p,h)&&!th))continue;
    res.set(K(h),{h,cost,nf,back,d,lim,thru:th})}
  return res}
function startAct(p){ev('select',{by:p.tpl,team:p.team});G.act={p,moved:false,used:false,rotFree:true,spent:0,rem:0};G.act.opts=moveOptions(G.act);UI.mode=null;return G.act}
const firstAction=a=>G.actCount===0&&!a.moved;
const restrictedKick=a=>G.restart&&G.restart.kicker===a.p.id&&!a.moved?G.restart.type:null;
function doMove(a,o){const p=a.p;const cp=G.carica?byId(G.carica.id):null;const before=cp?hd(p,cp):0;
  // in corsa se ha percorso almeno 6 m, o tutto il suo scatto se è più corto (es. chi conduce palla lentamente)
  const hb0=isHolder(p);let sc0=hb0?p.st.scattoP:p.st.scatto;if(p.halfMove||p.slowTurn===G.turn)sc0=Math.floor(sc0/2);const runMin=Math.max(2,Math.min(3,sc0));
  p.q=o.h.q;p.r=o.h.r;p.f=o.nf;p.state=(!o.back&&!o.brake&&o.d>=runMin)?'corsa':'fermo';p.moved=true;
  if(!o.back&&(isAI(p.team)||G.quiet)){const look=isHolder(p)?tgt(p.team):ballHex();if(look&&!same(look,p))p.f=dirTo(p,look)}

      if(gk&&!isSb(gk)&&hd(gk,tgt(att))<=2){const r=roll(gk.st.riflessi,tr('dice.reflex',{p:nm(gk)}),3);if(r.succ>=3){log(tr('log.saveCorner',{p:nm(gk)}));G.lastTouch=def}else return deflGoal(att)}

function passInfo(p,h,kind,extra=0){const d=hd(p,h);let pool,diff,mult;
  const wl=Math.max(0,Math.min(1,(d-8)/4)),pp=(1-wl)*p.st.passCorto+wl*p.st.passLungo;

// Intercetto: 2d6 per toccare la palla, poi Stop per controllarla
const P2D6=n=>n<=2?1:n>12?0:[0,0,36,35,33,30,26,21,15,10,6,3,1][n]/36;
function roll2d6(label,need){return{ok:chance(P2D6(need),label)}}
function interceptInfo(o,p,h,I,air){const dd=hd(o,h);if(dd>1)return null;const good=o.st.intercetto>=4,close=hd(p,h)<=2;
  const fast=!air&&I.d>10,stop=Math.max(1,o.st.stop-(fast?1:0));
  if(dd===0){const need=good?5:6;return{on:true,need,close:false,p:P2D6(need),canCtrl:inFront(o,p),stop}}
  const rel=stepDiff(o.f,dirTo(o,h));if(rel>1)return null;
  const need=(rel===0?(good?7:8):(good?8:9))+(close?1:0);
  return{on:false,front:rel===0,need,close,p:P2D6(need),canCtrl:true,stop}}
// probabilità che un passaggio preciso superi gli avversari sulla linea
function passClear(p,target,kind,extra){const I=passInfo(p,target,kind,extra),air=kind==='lancio',L=line(p,target),last=air?Math.min(3,L.length-1):L.length-1,seen=new Set();let pr=1;
  for(let i=1;i<last;i++)for(const o of G.players){if(o.team===p.team||isSb(o)||seen.has(o.id))continue;const ic=interceptInfo(o,p,L[i],I,air);if(!ic)continue;seen.add(o.id);pr*=1-ic.p}
  return pr}
async function resolvePass(p,target,kind,extra=0){
  const I=passInfo(p,target,kind,extra);
  log(tr(kind==='lancio'?'log.launchTo':'log.passTo',{p:nm(p),m:I.d*2,d:I.diff}));
  const R=roll(I.pool,tr(kind==='lancio'?'dice.launch':kind==='diretto'?'dice.passDirect':I.d<=10?'dice.passShort':'dice.passLong',{p:nm(p)}),I.diff);G.lastTouch=p.team;
  let fin=target;const def=I.diff-R.succ,margin=R.succ-I.diff;
  if(def>0){const map={1:3,2:0,3:-2,4:2,5:-1,6:1};
    const v=rollD6(tr('dice.devDir'));const dir=((dirTo(p,target)+map[v])%6+6)%6;fin=add(target,dir,def*I.mult);
    log(tr('log.imprecise',{m:def*I.mult*2,w:tr('dev.'+v)}));sub(tr('sub.imprecise',{m:def*I.mult*2,w:tr('dev.'+v)}),p.team)}else log(tr(margin>=2?'log.perfect':'log.precise'));
  G.ball={holder:null,pos:null,flight:null};
  const air=kind==='lancio',force=air?'lancio':I.d>10?'lungo':'corto';
  const path=line(p,fin),tried=new Set();
  const last=air?Math.min(3,path.length-1):path.length-1;
  for(let i=1;i<last;i++){const h=path[i];if(!inField(h))break;
    for(const o of opps(p.team)){if(tried.has(o.id)||isSb(o))continue;const dd=hd(o,h);if(dd>1)continue;if(dd===1&&!inFront(o,h))continue;
      const ic=interceptInfo(o,p,h,I,air);if(!ic)continue;
      tried.add(o.id);await animBall(px(h),{air:false});
      // 1) la tocca? 2d6 contro la soglia (davanti, di lato o sulla traiettoria)
      const t=roll2d6(tr(ic.on?'dice.icOn':ic.front?'dice.icFront':'dice.icSide',{p:nm(o)})+(ic.close?tr('dice.closeRange'):''),ic.need);
      if(!t.ok){if(ic.on){log(tr('log.tunnel',{p:nm(o)}));sub(tr('sub.tunnel',{p:nm(o)}),p.team)}else log(tr('log.missesIt',{p:nm(o)}));continue}
      G.lastTouch=o.team;
      // 2) la controlla o la devia? Stop (2 successi); sulla traiettoria solo se è girato verso la palla
      let ctrl=false;if(ic.canCtrl){const r=roll(ic.stop,tr('dice.icCtrl',{p:nm(o)}),2);ctrl=r.succ>=2}

      if(!ctrl){log(tr(ic.on?'log.hits':'log.touches',{p:nm(o)}));G.offList=null;return deflect(h,force,o,0,tr(ic.on?'sub.hits':'sub.touches',{p:nm(o)}))}
      // il difensore va sul pallone (si allunga sulla traiettoria), resta fermo e girato verso chi ha passato
      if(!ic.on){o.q=h.q;o.r=h.r;await wait(120)}o.state='fermo';o.f=dirTo(o,p);
      G.subWhy=tr('sub.intercept',{p:nm(o)});return gainBall(o,tr('why.intercept'))}}
  if(air&&I.d>22){const A=BALL.vis.cur,B=px(fin),mid={x:(A.x+B.x)/2,y:(A.y+B.y)/2};
    await animBall(mid,{air:true,half:1});G.ball.flight={h:fin,turn:G.turn+1,mid,off:G.offList,team:p.team};log(tr('log.inFlight'));sub(tr('sub.inFlight'),p.team);return}
  await animBall(px(fin),{air});
  return reception(fin,kind,I.d,tried)}

async function reception(fin,kind,dist,tried){tried=tried||new Set();
  if(!inField(fin))return outOfPlay(fin,true);
  // il portiere esce sui palloni alti nella sua area: fino a 2 esagoni, con le mani
  const gkReach=q=>q.gk&&kind==='lancio'&&inAreaOf(fin,q.team)&&hd(q,fin)<=2;
  const c=G.players.filter(q=>!isSb(q)&&!tried.has(q.id)&&(hd(q,fin)<=1||gkReach(q)));
  if(!c.length){log(tr('log.nobody'));sub(tr('sub.nobody'));return setLoose(fin)}
  const base=kind==='lancio'?3:(dist>10?2:1);let best=null,bm=-99,tie=false;
  for(const q of c){const on=same(q,fin),hands=gkReach(q),far=hd(q,fin)===2,diff=(hands?2:base)+pressure(q);
    const r=roll(q.st.stop-(on?0:1)+(hands?1:0)-(far?1:0),hands?tr('dice.gkHigh',{p:nm(q)}):tr(kind==='lancio'?'dice.stopHigh':'dice.stop',{p:nm(q)}),diff);const m=r.succ-diff;
    if(m>bm){bm=m;best=q;tie=false}else if(m===bm&&best.team!==q.team)tie=true}
  if(bm<0){log(tr('log.badControl'));return rebound(fin,null,tr('sub.badControl'))}
  if(tie){log(tr('log.contested'));return rebound(fin,null,tr('sub.contested'))}
  if(bm>=1){best.f=dirTo(best,tgt(best.team));log(tr('log.orientedStop',{p:nm(best)}))}
  G.subWhy=tr('sub.received',{p:nm(best)});gainBall(best,tr('why.control'))}

// Tiro: geometria (corpi vicino alla linea, posizione del portiere)
function shotGeo(from,team,z,giro=false){const tg=zoneHex(z,team),goal=tgt(team),path=line(from,tg),high=z.r===0;
  const blockers=[];let cover=0;
  for(const o of G.players){if(o.team===team||o.gk||isSb(o))continue;let best=null;
    for(let i=1;i<path.length;i++){const dd=hd(o,path[i]);if(dd<=1&&(best===null||dd<best.dd))best={dd,i}}
    if(!best)continue;
    // a giro la palla aggira i corpi: contano solo quelli sulla linea vicino a chi calcia (la barriera)
    if(giro){if(best.dd===0&&hd(o,from)<=6)blockers.push({o,dd:0,i:best.i,wall:true});continue}

  const res={},car=holderP(),ball=ballHex()||kickSpot(),protect=ownG(team);

  const gk=gkOf(team);if(gk){const L=line(protect,ball);

    const cd=car&&car.team!==team?hd(car,protect):99;res[gk.id]=L[Math.min(cd<=5?2:cd<=8?2:1,L.length-1)];
    if(G.ball.pos&&hd(gk,G.ball.pos)<=4&&hd(gk,G.ball.pos)<=Math.min(9,...as.map(x=>hd(x,G.ball.pos))))res[gk.id]=G.ball.pos}

function aiPlan(team,R){const mv=[],T=R.team;

    const near=(R.type==='angolo'||(R.type==='punizione'&&dG(R.spot,T)<=18));
    if(near){const slots=[[17,3],[21,3],[19,5],[15,6],[23,6],[19,2]].map(([c,r])=>T==='A'?offToAx(c,r):offToAx(c,H-1-r));
      const free=atk.slice();for(const s of slots){if(!free.length)break;free.sort((x,y)=>hd(x,s)-hd(y,s));const p=free.shift();mv.push({id:p.id,h:s})}}
    else{const S=attS(T);for(const p of atk){if(hd(p,R.spot)>22)continue;let best=null;for(const h of FIELD){if(hd(h,p)>8||!validPlace(p,h,R))continue;const s=V(p,h,S)+0.4*Math.min(mateDist(h,p),6);if(!best||s>best.s)best={s,h}}if(best)mv.push({id:p.id,h:best.h})}}}

function aiDecide(team,kind,data){

      return bestIntensity(data.def,data.att,data.bonus||0,rush,area,S).k}
    case'carica':{const S=attS(data.p.team);const c=data.committed;if(c.length&&data.p.st.finta>=Math.max(...c.map(q=>q.st.lettura)))return'finta';
      if(data.type==='tiro'){const xs=bestShot(data.p,data.p,false,0).xg,xgi=canGiro(data.p)?bestShot(data.p,data.p,'giro',0,GIRO_Z.map(i=>ZONES[i])).xg:0;

$('camIn').onclick=()=>{CAM.follow=false;camZoom(1.4)};$('camOut').onclick=()=>{CAM.follow=false;camZoom(1/1.4)};
$('camFit').onclick=()=>{CAM.follow=false;CAM.z=zMin();applyCam();renderCamBtns()};
$('camFollow').onclick=()=>{CAM.follow=!CAM.follow;renderCamBtns()};
$('mode').onchange=()=>{try{localStorage.setItem(MODEK,$('mode').value)}catch(e){}G.ctrl=ctrlFromMode();closeMenu();if(G.act&&isAI(G.act.p.team)&&!G.act.used)G.act=null;render()};
$('stA').onchange=$('stD').onchange=()=>{G.strat=stratFromUI();G._dp=null;render()};
$('gtype').onchange=()=>{if($('gtype').value==='partita')startMatch();else{TUT.on=false;reset(currentScen())}};
$('startMatch').onclick=startMatch;
$('langSel').onchange=()=>{LANG=$('langSel').value;try{localStorage.setItem(LANGK,LANG)}catch(e){}applyI18n();render()};
window.addEventListener('resize',()=>{if(G&&!!ROT!==wantRot()){buildStatic();buildPlayers();camReset();render();return}sizeField();CAM.vb='';applyCam()});
// Blocca lo zoom della pagina (resta solo lo zoom del campo)
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
$('subs').onclick=()=>{const l=$('log');if(l)l.closest('section').scrollIntoView({behavior:'smooth',block:'center'})};
// Riepilogo della partita/azione da copiare (per i tester)
function summaryText(){const E=G.events,T=['A','D'],nmT=t=>teamWord(t);
  const cnt=(f)=>T.map(t=>E.filter(e=>e.team===t&&f(e)).length);
  const row=(lb,a,b)=>lb.padEnd(26)+String(a[0]+(b?'/'+b[0]:'')).padStart(8)+String(a[1]+(b?'/'+b[1]:'')).padStart(10);
  const pas=cnt(e=>e.type==='pass'&&e.kind!=='lancio'),pok=cnt(e=>e.type==='pass'&&e.kind!=='lancio'&&e.out==='ok');
  const lan=cnt(e=>e.type==='pass'&&e.kind==='lancio'),lok=cnt(e=>e.type==='pass'&&e.kind==='lancio'&&e.out==='ok');
  const sh=cnt(e=>e.type==='shot'),gl=T.map(t=>E.filter(e=>e.type==='goal'&&e.team===t).length);
  const tk=cnt(e=>e.type==='tackle'),tkw=cnt(e=>e.type==='tackle'&&e.out==='def');
  const dr=cnt(e=>e.type==='dribble'),drw=cnt(e=>e.type==='dribble'&&e.out==='att');
  const fo=cnt(e=>e.type==='foul'),ca=cnt(e=>e.type==='foul'&&e.card),off=cnt(e=>e.type==='offside');
  const lost=T.map(t=>E.filter(e=>e.type==='turnover'&&e.team!==t).length),act=cnt(e=>e.type==='select');
  const mode={'vsD':tr('setup.mode.vsD'),'vsA':tr('setup.mode.vsA'),'2g':tr('setup.mode.2g')}[$('mode').value]||'';
  const real=Math.round((Date.now()-(G.t0||Date.now()))/60000);
  return [`Calcio Tattico ${VERSION} · ${G.scName||''}`,`${tr('sum.mode')}: ${mode}`,
    `${tr('sum.result')}: ${G.over&&G.result?G.result.title.replace(/<[^>]+>/g,''):tr('sum.inProgress')}`,
    `${tr('sum.turns')}: ${G.turn} · ${tr('sum.gameTime')}: ${clock()} · ${tr('sum.realTime')}: ${real} min`,'',
    ''.padEnd(26)+nmT('A').padStart(8)+nmT('D').padStart(10),
    row(tr('sum.passes'),pok,pas),row(tr('sum.launches'),lok,lan),row(tr('sum.shots'),sh),row(tr('sum.goals'),gl),
    row(tr('sum.tackles'),tkw,tk),row(tr('sum.dribbles'),drw,dr),row(tr('sum.fouls'),fo),row(tr('sum.cards'),ca),row(tr('sum.offside'),off),
    row(tr('sum.lost'),lost),row(tr('sum.acts'),act)].join('\n')}
function openSummary(){const txt=summaryText();const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  choose(tr('sum.title'),`<div class="hint">${tr('sum.hint')}</div><pre class="sumtxt">${esc(txt)}</pre>`,[{k:'copy',t:tr('sum.copy')},{k:'close',t:tr('sum.close')}]).then(k=>{
    if(k!=='copy')return;const ok=()=>toast(tr('sum.copied'));
    try{navigator.clipboard.writeText(txt).then(ok,()=>{fallbackCopy(txt);ok()})}catch(e){fallbackCopy(txt);ok()}})}
function fallbackCopy(t){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove()}
$('sumBtn').onclick=openSummary;
try{const m=localStorage.getItem(MODEK);if(m&&[...$('mode').options].some(o=>o.value===m))$('mode').value=m}catch(e){}
applyI18n();$('stD').value='possesso|zona';reset();requestAnimationFrame(tick);

</script>
